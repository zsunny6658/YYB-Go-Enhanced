services:
  yyb-go:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/yyb-go:latest
    container_name: yyb-go
    restart: unless-stopped
    command:
      - -host
      - 0.0.0.0
      - -port
      - "8000"
      - -resource-root
      - /app/resource
      - -keepalive-interval
      - ${YYB_KEEPALIVE_INTERVAL:-1m}
      - -keepalive-ahead
      - ${YYB_KEEPALIVE_AHEAD:-45m}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PANEL_TYPE: ${PANEL_TYPE:-qinglong}
      QL_URL: ${QL_URL:-}
      QL_CLIENT_ID: ${QL_CLIENT_ID:-}
      QL_CLIENT_SECRET: ${QL_CLIENT_SECRET:-}
      DAIDAI_URL: ${DAIDAI_URL:-}
      DAIDAI_APP_KEY: ${DAIDAI_APP_KEY:-}
      DAIDAI_APP_SECRET: ${DAIDAI_APP_SECRET:-}
      ARCADIA_URL: ${ARCADIA_URL:-}
      ARCADIA_TOKEN: ${ARCADIA_TOKEN:-}
      YYB_QINGLONG_SERVER: ${YYB_QINGLONG_SERVER:-yyb-go:8000}
      YYB_QINGLONG_REPO: ${YYB_QINGLONG_REPO:-SuperNaiBA_YYB-GO-Script,525815266_YYB-Go-Enhanced/scripts}
      YYB_AUTH_DRIVER: ${YYB_AUTH_DRIVER:-}
      YYB_AUTH_DSN: ${YYB_AUTH_DSN:-}
      YYB_AUTH_MYSQL_DSN: ${YYB_AUTH_MYSQL_DSN:-}
      YYB_ADMIN_USER: ${YYB_ADMIN_USER:-}
      YYB_ADMIN_PASSWORD: ${YYB_ADMIN_PASSWORD:-}
      YYB_COOKIE_SECURE: ${YYB_COOKIE_SECURE:-false}
      YYB_ENABLE_PC_LOGIN: ${YYB_ENABLE_PC_LOGIN:-false}
    volumes:
      - ./data/db:/app/resource/db
      - ./data/avatars:/app/resource/avatars
      - ./data/qr:/app/resource/qr
    ports:
      - "0.0.0.0:9001:8000"
    networks:
      - trim-default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  wx-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    image: local/wx-proxy:latest
    container_name: wx-proxy
    restart: unless-stopped
    depends_on:
      yyb-go:
        condition: service_healthy
    environment:
      PROXY_PORT: "8787"
      YYB_URL: "http://yyb-go:8000"
      AUTH_TOKEN: "aa06c54e82f5439dc025e5f223b6466f"
    volumes:
      - ./wx-proxy/wx-proxy.py:/app/wx-proxy.py:ro
    ports:
      - "0.0.0.0:8787:8787"
    networks:
      - trim-default

networks:
  trim-default:
    external: true
    name: trim-default
